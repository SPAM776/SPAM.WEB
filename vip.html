<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link rel="stylesheet" href="style.css">
    <style>
        /* تصميم شاشة القفل */
        .login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #090a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            background: #12141c;
            border: 1px solid #00e676;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
        }

        .login-box h2 {
            color: #00e676;
            margin-bottom: 20px;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1a1d28;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #00e676;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }

        .error-msg {
            color: #ff5252;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* شاشة تأثير الهكرز 10101010 Matrix Effect */
        #matrixCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9998;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول والرمز السري -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔒 قسم SPAM-VIP</h2>
            <input type="text" id="vipCode" class="login-input" placeholder="أدخل الرمز (CODE)">
            <input type="password" id="vipPass" class="login-input" placeholder="كلمة المرور (PASSWORD)">
            <button class="login-btn" onclick="checkAccess()">دخول الخانة VIP</button>
            <p class="error-msg" id="errorMsg">❌ الرمز أو كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <!-- 2. الشاشة السوداء والأرقام الخضراء (تأثير سقوط 10101010) -->
    <canvas id="matrixCanvas"></canvas>

    <!-- 3. محتوى التطبيقات المهكرة (مخفي حتى يتم تسجيل الدخول) -->

        </header>

        <div class="container">
            <h1 class="page-title">🎮 جميع الأنواع - ألعاب وتطبيقات مهكرة</h1>

            <div class="apps-grid">

                <!-- ===== تطبيق رقم 1 ===== -->

                </div>

                <!-- ===== تطبيق رقم 2 ===== -->
                <div class="app-card">
                    <img src="XXXXXX.png" alt="XXXXXX" class="app-icon">
                    <div class="app-info">
                        <h3>XXXXXX</h3>
                        <p>الحجم: XX MB</p>
                    </div>
                    <button class="download-btn" onclick="openDownloadModal('رابط')">تحديث وتحميل التطبيق</button>
                </div>

                <!-- ===== تطبيق رقم 3 ===== -->
                <div class="app-card">
                    <img src="XXXXXX.png" alt="XXXXXX" class="app-icon">

                        <h3>XXXXXX</h3>
                        <p>الحجم: XX MB</p>

    <!-- نافذة الانتظار الإعلانية -->
    <div class="modal-overlay" id="downloadModal">
        <div class="modal-box">
            <div class="spinner"></div>
            <p class="countdown-text">جاري فحص الملف وتجهيز الرابط...</p>

            <div class="ad-area">

                <div id="container-8ddb5471c114c257a75fcf759da7fdd4"></div>
            </div>

            <p class="countdown-text">يرجى الانتظار: <span class="countdown-number" id="timer">10</span> ثانية</p>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- سكريبت التحقق وأنيميشن Matrix (10101010) -->
    <script>
        function checkAccess() {
            var code = document.getElementById("vipCode").value;
            var pass = document.getElementById("vipPass").value;
            var error = document.getElementById("errorMsg");

            // الرمز وكلمة المرور المطلوبة
            if (code === "SPAM-VIP" && pass === "SFIN7474") {
                error.style.display = "none";
                document.getElementById("loginOverlay").style.display = "none";
                
                // تشغيل الشاشة السوداء بالأرقام الخضراء 10101010
                startMatrixAnimation();
            } else {
                error.style.display = "block";
            }
        }

        function startMatrixAnimation() {
            var canvas = document.getElementById("matrixCanvas");
            var ctx = canvas.getContext("2d");

            canvas.style.display = "block";
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            var letters = "1010101010101010";
            letters = letters.split("");

            var fontSize = 16;
            var columns = canvas.width / fontSize;
            var drops = [];

            for (var i = 0; i < columns; i++) {
                drops[i] = 1;
            }

            function draw() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00e676"; // اللون الأخضر
                ctx.font = fontSize + "px monospace";

                for (var i = 0; i < drops.length; i++) {
                    var text = letters[Math.floor(Math.random() * letters.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            var interval = setInterval(draw, 33);

            // بعد 3 ثوانٍ كتسالي الأنيميشن وتبان التطبيقات
            setTimeout(function() {
                clearInterval(interval);
                canvas.style.display = "none";
                document.getElementById("vipContent").style.display = "block";
            }, 3000);
        }
    </script>
</body>
</html>
